[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-avatar-live"
version = "0.1.0"
description = "Continuous Facebook comment to LLM, ZeroTTS, MuseTalk, and RTMPS pipeline"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "zerotts==0.1.5",
]

[project.scripts]
fb-avatar-live = "fb_avatar_live.main:run"

[tool.setuptools.packages.find]
where = ["src"]
