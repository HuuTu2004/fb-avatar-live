[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-avatar-live"
version = "0.1.0"
description = "Continuous Facebook and TikTok LIVE comment to AI avatar pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "python-multipart>=0.0.9,<1",
  "soundfile>=0.12,<1",
  "TikTokLive>=7.0,<8",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=15,<18",
  "zerotts==0.1.5",
]

[project.scripts]
fb-avatar-live = "fb_avatar_live.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fb_avatar_live.live_reply" = ["dharma_cards.json"]
