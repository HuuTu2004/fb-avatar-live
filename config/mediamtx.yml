logLevel: info
logDestinations: [stdout]

rtsp: true
rtspAddress: 127.0.0.1:8554
rtmp: true
rtmpAddress: 127.0.0.1:1935

hls: true
hlsAddress: 127.0.0.1:8888
hlsAllowOrigins: ['*']
hlsAlwaysRemux: true

webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: ''
webrtcLocalTCPAddress: 127.0.0.1:8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: ['127.0.0.1']
webrtcICEServers2: []

api: true
apiAddress: 127.0.0.1:9997

paths:
  avatar:
    source: publisher
  avatar_studio:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel warning -rtsp_transport tcp
      -i rtsp://127.0.0.1:8554/avatar -map 0:v:0 -map 0:a:0
      -c:v copy -c:a aac -b:a 128k -ar 48000 -ac 2
      -f rtsp rtsp://127.0.0.1:8554/avatar_studio
    runOnDemandRestart: true
